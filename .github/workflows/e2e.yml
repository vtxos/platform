# Send to banks and mobile money end to end: this platform, a real cosigner in a dev enclave, a
# regtest Ark server — and the fake Grid, so no Grid secrets are needed. The wallet's
# `make send-walkthrough`, run against this checkout.
#
# The wallet (vtxos/wallet, `wallet_ref`, main by default) runs the cosigner release its dev enclave
# image serves, and this platform must be built against the same release: the step below refuses
# them apart. The enclave runs on the runner's KVM, as the wallet's own enclave-e2e job does. Nested
# virtualisation on hosted runners works but is not something GitHub supports, so this is the job
# that can fail for reasons outside either repository; its logs are uploaded when it does.
name: e2e

on:
  workflow_dispatch:
    inputs:
      wallet_ref:
        description: The vtxos/wallet ref to run the walkthrough from
        default: main
  schedule:
    - cron: '17 3 * * *'

jobs:
  send-walkthrough:
    name: send walkthrough (fake Grid, dev enclave, KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: MerlinPlatform
      - uses: actions/checkout@v4
        with:
          repository: vtxos/wallet
          ref: ${{ inputs.wallet_ref || 'main' }}
          path: MerlinWallet
      - name: The wallet runs the cosigner release this platform builds against
        run: |
          git -C MerlinWallet submodule update --init third_party/cosigner
          git -C MerlinWallet/third_party/cosigner fetch -q --tags origin
          wallet="$(git -C MerlinWallet/third_party/cosigner describe --tags --exact-match HEAD)"
          ours="$(grep -o 'vtxos/cosigner", tag = "[^"]*' MerlinPlatform/Cargo.toml | cut -d'"' -f3 | sort -u)"
          [ "$wallet" = "$ours" ] || {
            echo "the wallet runs cosigner $wallet, this platform builds against ${ours:-(none)}" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            MerlinWallet/ffi/target
            MerlinWallet/.platform/build/target
          key: e2e-${{ hashFiles('MerlinPlatform/Cargo.lock') }}
          restore-keys: e2e-
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - name: Install protoc and the Dart plugin
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          # Pinned: the generator must match the protobuf runtime MerlinWallet's `protocol` pins.
          dart pub global activate protoc_plugin 21.1.2
      - name: Let this user open KVM, and load the vsock loopback transport
        run: |
          if [ -e /dev/kvm ] && [ ! -r /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          [ -e /dev/vsock ] || sudo modprobe vsock_loopback
      - name: The protocol stubs
        working-directory: MerlinWallet
        run: make proto
      - name: The walkthrough
        working-directory: MerlinWallet
        env:
          # Where scripts/platform.sh finds this platform, to build it against the wallet's cosigner.
          MERLIN_PLATFORM: ${{ github.workspace }}/MerlinPlatform
        run: make send-walkthrough
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: send-walkthrough-logs
          path: |
            MerlinWallet/.platform/run/*.log
            MerlinWallet/.enclave-run/bundle/target/qemu-nitro/vtxos/*.log
